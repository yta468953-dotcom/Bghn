name: SHADOW_CORE_VPS
on: workflow_dispatch # يسمح لك بتشغيله يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Setup Tmate Session
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-user: false # للسماح لك بالدخول فوراً
