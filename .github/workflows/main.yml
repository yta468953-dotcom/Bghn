name: CLOUDFLARE_DIRECT_SSH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Force Connect Environment
        run: |
          # 1. تنظيف وإعداد المستخدم
          sudo useradd -m admin_core -s /bin/bash
          sudo usermod -aG sudo admin_core
          echo "admin_core:password123" | sudo chpasswd
          
          # 2. إعداد الـ SSH بضبط يسمح بالاتصال السريع
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart
          
          # 3. تحميل وتثبيت أداة النفق
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # 4. تشغيل النفق بصيغة "الربط المباشر"
          echo "GENERATING SECURE LINK..."
          nohup cloudflared tunnel --url tcp://127.0.0.1:22 > cf.log 2>&1 &
          
          # 5. استخراج الرابط بشكل متكرر لضمان ظهوره
          sleep 20
          echo "------------------------------------"
          echo "SSH CONNECTION DETAILS FOR TERMIUS:"
          grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" cf.log | sed 's/https:\/\//tcp:\/\//'
          echo "------------------------------------"
          
          # إبقاء المهمة تعمل
          sleep 21600
