name: CLOUDFLARE_STABLE_SSH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Stable Environment
        run: |
          # 1. إعداد المستخدم
          sudo useradd -m core_user -s /bin/bash
          sudo usermod -aG sudo core_user
          echo "core_user:password123" | sudo chpasswd
          
          # 2. تحديث وتثبيت SSH مع ضبط الاستقرار
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "TCPKeepAlive yes" | sudo tee -a /etc/ssh/sshd_config
          echo "ClientAliveInterval 30" | sudo tee -a /etc/ssh/sshd_config
          sudo service ssh restart
          
          # 3. تحميل وتثبيت Cloudflared (الطريقة المضمونة)
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          
          # 4. تشغيل النفق (سيبقى حياً طالما المهمة تعمل)
          echo "------------------------------------"
          echo "SERVER IS READY! COPY THE LINK BELOW:"
          cloudflared tunnel --url tcp://127.0.0.1:22
          
