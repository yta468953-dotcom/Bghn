name: CLOUDFLARE_STABLE_SSH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Stable Environment
        run: |
          # 1. إعداد المستخدم والـ SSH
          sudo useradd -m core_user -s /bin/bash
          sudo usermod -aG sudo core_user
          echo "core_user:password123" | sudo chpasswd
          sudo apt-get update && sudo apt-get install -y openssh-server
          
          # 2. ضبط الـ SSH لمنع الـ Broken pipe
          sudo sed -i 's/#TCPKeepAlive yes/TCPKeepAlive yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#ClientAliveInterval 0/ClientAliveInterval 15/' /etc/ssh/sshd_config
          sudo sed -i 's/#ClientAliveCountMax 3/ClientAliveCountMax 100/' /etc/ssh/sshd_config
          sudo service ssh restart
          
          # 3. تحميل وتثبيت Cloudflared
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          
          # 4. تشغيل النفق وإبقاء المهمة تعمل
          echo "SERVER READY - USE THE LINK BELOW"
          cloudflared tunnel --url tcp://localhost:22
          
